# Builds the frontend against the latest demo bundle (a demo-bundle-* release made by the
# Demo bundle workflow), smoke-tests it in a browser, and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Fetch the latest demo bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("demo-bundle-"))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            echo "::error::No demo-bundle-* release yet: run the Demo bundle workflow first."; exit 1
          fi
          gh release download "$tag" --repo "${{ github.repository }}" --pattern demo-bundle.tar.gz --dir ..
          mkdir -p public/data
          tar xzf ../demo-bundle.tar.gz -C public/data
          echo "Demo data: $tag ($(ls public/data/tracks | wc -l) tracks)" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the demo in a browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts
        env:
          CI: "1"
      - run: npm run build
        env:
          VITE_DATA_SOURCE: static
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
