[project]
name = "moody"
version = "0.1.0"
description = "Music mood analysis with modern MIR: valence/arousal maps, mood-path playlists, streaming history."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy MIR stack. Wheels exist for CPython 3.9–3.13 on Linux x86_64 and macOS.
analysis = [
    "essentia-tensorflow==2.1b6.dev1389",
    "numpy>=1.26",
]

[project.scripts]
moody = "moody.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moody"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["moody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: requires essentia-tensorflow and downloaded models (slow)"]
addopts = "-m 'not models'"
