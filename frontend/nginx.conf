server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Server-sent events (job progress) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
